spring.application.name=vaptvupt

# Lê as variáveis do arquivo backend/.env (se existir)
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Banco de dados: Supabase (PostgreSQL)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# O Hibernate cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Tokens de login
vaptvupt.jwt.segredo=${JWT_SECRET}
vaptvupt.jwt.validade-horas=8
